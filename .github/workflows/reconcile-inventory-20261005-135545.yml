name: Reconcile FARA inventory 2026-10-05 13:55

on:
  push:
    branches:
      - inventory-20261005-135545
    paths:
      - .github/workflows/reconcile-inventory-20261005-135545.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconcile inventory and storefront ordering
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const inventoryPath = 'assets/inventory.json';
          const data = JSON.parse(fs.readFileSync(inventoryPath, 'utf8'));

          const norm = (value) => String(value || '')
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .toLowerCase()
            .trim();

          const allVariants = () => data.products.flatMap((product) =>
            product.variants.map((variant) => ({ product, variant }))
          );
          const matchesForSku = (sku) => allVariants().filter((entry) => entry.variant.sku === sku);

          const priceUpdates = {
            FARA00090000: 1490,
            FARA00090001: 1495,
            FARA00090002: 980,
            FARA00090003: 1150
          };
          for (const [sku, price] of Object.entries(priceUpdates)) {
            const matches = matchesForSku(sku);
            if (matches.length !== 1) throw new Error(`${sku}: se esperaba una sola referencia y se encontraron ${matches.length}`);
            matches[0].variant.price = price;
          }

          const avenue = data.products.find((p) => p.id === 'lipstick-avenue-matte-de-maybelline');
          const scuse = data.products.find((p) => p.id === 'lipstick-scuse-me-matte-de-maybelline');
          if (!avenue) throw new Error('No se encontró Lipstick Avenue Matte de Maybelline');
          if (!scuse) throw new Error('No se encontró Lipstick scuse me matte de Maybelline');

          const avenueSnapshot = [
            { sku: 'FARA00055002', tone: '002', price: 350, stock: 2, status: 'active' },
            { sku: 'FARA00055006', tone: '006', price: 350, stock: 4, status: 'active' },
            { sku: 'FARA00055007', tone: '007', price: 350, stock: 1, status: 'active' },
            { sku: 'FARA00055008', tone: '008', price: 350, stock: 2, status: 'active' }
          ];

          const currentAvenueSources = [...avenue.variants, ...scuse.variants];
          avenue.variants = avenueSnapshot.map((target) => {
            const candidates = currentAvenueSources.filter((v) => v.sku === target.sku);
            const preferred = candidates.find((v) => v.status === 'active') || candidates[0] || {};
            const merged = { ...preferred, ...target };
            delete merged.reason;
            delete merged.sourceSku;
            return merged;
          });
          avenue.name = 'Lipstick Avenue Matte de Maybelline';
          avenue.brand = 'Maybelline';
          avenue.category = 'Labiales';
          avenue.presentation = '0.12 oz';
          avenue.description = 'Lipstick Avenue Matte de Maybelline es un labial en barra de acabado mate y color intenso, con aplicación cremosa y cobertura uniforme para definir los labios. La familia queda consolidada en los tonos 002, 006, 007 y 008.';

          data.products = data.products.filter((p) => p.id !== scuse.id);

          data.source = {
            ...(data.source || {}),
            kind: 'inventory-reconciliation',
            file: 'inventario-avanzado-20261005-135545.xlsx',
            receivedDate: '2026-10-05',
            cutoff: '2026-10-05 13:55:45 CST',
            stockIsSnapshot: true,
            timezone: 'America/Tegucigalpa',
            notes: 'Catálogo reconciliado con el corte del 5 de octubre de 2026 a las 13:55:45; se conservaron las 455 referencias, se actualizaron cuatro precios y la presentación de Avenue Matte, se consolidó Scuse Me Matte dentro de Avenue Matte y se agruparon labiales y tintas para el orden de navegación.'
          };

          const isLip = (product) => norm(product.category) === 'labiales';
          const isTint = (product) => !isLip(product) && /^tinta\b/.test(norm(product.name));
          const isBeautyBlock = (product) => isLip(product) || isTint(product);
          const firstBlockIndex = data.products.findIndex(isBeautyBlock);
          if (firstBlockIndex < 0) throw new Error('No se encontraron labiales/tintas para ordenar');
          const before = data.products.slice(0, firstBlockIndex).filter((p) => !isBeautyBlock(p));
          const lips = data.products.filter(isLip);
          const tints = data.products.filter(isTint);
          const after = data.products.slice(firstBlockIndex).filter((p) => !isBeautyBlock(p));
          data.products = [...before, ...lips, ...tints, ...after];

          fs.writeFileSync(inventoryPath, JSON.stringify(data, null, 2) + '\n');

          const testPath = 'tests/unified-inventory.test.js';
          let test = fs.readFileSync(testPath, 'utf8');
          test = test.replace('inventario-avanzado-20261005-094033.xlsx', 'inventario-avanzado-20261005-135545.xlsx');
          test = test.replace('[118,455,388,888,67]', '[117,455,388,888,67]');
          test = test.replace(
            /test\('New product families keep image null for later uploads',[\s\S]*?\n\}\);\n\n/,
            `test('Curated product images stay available after reconciliation',()=>{\n  for(const product of data.products){\n    assert.ok(Object.hasOwn(product,'image'),product.id);\n  }\n  assert.equal(data.products.find(p=>p.id==='lipstick-avenue-matte-de-maybelline').image,'assets/products/Lipstick Avenue Matte de Maybelline.avif');\n  assert.equal(data.products.find(p=>p.id==='glow-reviver-lip-oil-de-e-l-f').image,'assets/products/Glow Reviver Lip Oil de e.l.f..avif');\n});\n\n`
          );

          const marker = "test('Shopping exposes only currently active references',()=>{";
          if (!test.includes("Avenue Matte consolidates the former Scuse Me shades")) {
            const extra = `test('Avenue Matte consolidates the former Scuse Me shades',()=>{\n  const avenue=data.products.find(p=>p.id==='lipstick-avenue-matte-de-maybelline');\n  assert.ok(avenue);\n  assert.equal(data.products.some(p=>/scuse me/i.test(p.name)||p.id==='lipstick-scuse-me-matte-de-maybelline'),false);\n  assert.equal(avenue.presentation,'0.12 oz');\n  assert.deepEqual(avenue.variants.map(v=>v.sku).sort(),['FARA00055002','FARA00055006','FARA00055007','FARA00055008']);\n  assert.deepEqual(avenue.variants.map(v=>v.tone).sort(),['002','006','007','008']);\n  assert.ok(avenue.variants.every(v=>v.status==='active'));\n});\n\ntest('Latest spreadsheet price updates are applied',()=>{\n  assert.equal(variant('FARA00090000').price,1490);\n  assert.equal(variant('FARA00090001').price,1495);\n  assert.equal(variant('FARA00090002').price,980);\n  assert.equal(variant('FARA00090003').price,1150);\n});\n\ntest('Labiales and tintas are consecutive in featured scroll',()=>{\n  const isLip=p=>String(p.category||'').toLocaleLowerCase('es')==='labiales';\n  const isTint=p=>!isLip(p)&&/^tinta\\b/i.test(String(p.name||''));\n  const indexes=data.products.map((p,i)=>(isLip(p)||isTint(p))?i:-1).filter(i=>i>=0);\n  assert.ok(indexes.length>1);\n  assert.equal(Math.max(...indexes)-Math.min(...indexes)+1,indexes.length);\n  const block=data.products.slice(Math.min(...indexes),Math.max(...indexes)+1);\n  const firstTint=block.findIndex(isTint);\n  if(firstTint>=0){\n    assert.ok(block.slice(0,firstTint).every(isLip));\n    assert.ok(block.slice(firstTint).every(isTint));\n  }\n});\n\n`;
            test = test.replace(marker, extra + marker);
          }
          fs.writeFileSync(testPath, test);
          NODE

          node scripts/inventory.js validate
          node --test tests/*.test.js

          node <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('assets/inventory.json','utf8'));
          const api = require('./assets/inventory-document.js');
          const inspection = api.inspectInventory(data);
          const expected = [117,455,388,888,67];
          const actual = [inspection.stats.products,inspection.stats.skus,inspection.stats.activeSkus,inspection.stats.activeUnits,inspection.stats.archivedSkus];
          if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error(`Stats inesperadas: ${JSON.stringify(actual)}`);
          if (data.source.file !== 'inventario-avanzado-20261005-135545.xlsx') throw new Error(`Fuente incorrecta: ${data.source.file}`);
          if (data.products.some(p => p.id === 'lipstick-scuse-me-matte-de-maybelline' || /scuse me/i.test(p.name))) throw new Error('Scuse Me Matte sigue publicado');
          const avenue = data.products.find(p => p.id === 'lipstick-avenue-matte-de-maybelline');
          if (!avenue || avenue.variants.length !== 4) throw new Error('Avenue Matte no quedó consolidado');
          const jsonFiles = fs.readdirSync('assets').filter(name => name.endsWith('.json'));
          if (JSON.stringify(jsonFiles) !== JSON.stringify(['inventory.json'])) throw new Error(`JSON inesperados: ${jsonFiles.join(', ')}`);
          console.log(JSON.stringify({source:data.source.file,stats:inspection.stats,avenue:avenue.variants},null,2));
          NODE

      - name: Commit reconciled inventory
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/reconcile-inventory-20261005-135545.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/inventory.json tests/unified-inventory.test.js .github/workflows/reconcile-inventory-20261005-135545.yml
          git diff --cached --quiet && exit 0
          git commit -m "Reconcile 13:55 inventory and consolidate Maybelline lipsticks"
          git push origin HEAD:inventory-20261005-135545

# trigger run
