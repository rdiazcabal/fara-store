name: One-time inventory consolidation
on:
  push:
    branches:
      - refactor/unify-inventory
    paths:
      - scripts/finish-unification.js
      - .github/workflows/inventory-unification.yml
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Switch all inventory consumers to the canonical file
        run: |
          node --check scripts/finish-unification.js
          node scripts/finish-unification.js
          node -e "const fs=require('fs');const p='tests/unified-inventory.test.js';const s=fs.readFileSync(p,'utf8');const a=\"v.sku==='FARA00004118'?{...v,status:'active'}:v\";const b=\"v.sku==='FARA00004118'?{...v,status:'active',stock:1}:v\";if(!s.includes(a))throw Error('Test fixture not found');fs.writeFileSync(p,s.replace(a,b));"
          node --check assets/inventory-document.js
          node --check scripts/inventory.js
          node --test tests/*.test.js
          node scripts/inventory.js validate
      - name: Commit the verified refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: use one canonical inventory JSON throughout FARA'
          git push origin HEAD:refactor/unify-inventory
