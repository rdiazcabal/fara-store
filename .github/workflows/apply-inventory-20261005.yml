name: Apply FARA inventory 2026-10-05

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-inventory-20261005.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconcile catalog with October 5 spreadsheet
        shell: bash
        run: |
          printf '%s' ' dC1pbi1taWxrLXN1bnNjcmVlbi1yb3N0cm8tY3VlcnBvLWRlLWxhLXJvY2hlLXBvc2F5IgogICAgICB9CiAgICB9CiAgXX0=' | tr -d ' ' | base64 -d > /tmp/inventory-update.json
          node scripts/inventory.js apply /tmp/inventory-update.json
          node - <<'NODE'
          const fs = require('node:fs');
          const file = 'assets/inventory.json';
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));
          data.source.notes = 'Catálogo reconciliado con el corte del 5 de octubre de 2026; se actualizaron existencias y precios de los SKU existentes y se agregaron únicamente las referencias nuevas, evitando duplicados.';
          fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n');
          NODE

      - name: Validate updated catalog
        shell: bash
        run: |
          node scripts/inventory.js validate
          node - <<'NODE'
          const fs = require('node:fs');
          const api = require('./assets/inventory-document.js');
          const data = JSON.parse(fs.readFileSync('assets/inventory.json', 'utf8'));
          const checked = api.inspectInventory(data);
          const expected = [118,455,388,887,67];
          const actual = [checked.stats.products,checked.stats.skus,checked.stats.activeSkus,checked.stats.activeUnits,checked.stats.archivedSkus];
          if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error(`Stats inesperadas: ${JSON.stringify(actual)}`);
          const newIds = ["anthelios-mineral-light-fluid-sunscreen-spf-50-de-la-roche-posay","anthelios-melt-in-milk-sunscreen-rostro-cuerpo-de-la-roche-posay","toleriane-purifying-foaming-face-wash-de-la-roche-posay","shea-better-24h-moisture-body-wash-coconut-waters-de-eos-16-oz","shea-better-24h-moisture-body-lotion-vanilla-cashmere-de-eos-16-oz","paradise-hyaluron-tint-lip-stain-serum-de-loreal","glow-reviver-lip-oil-de-e-l-f","radiant-tone-dual-serum-de-eucerin","q10-revitalize-daily-cream-de-eucerin","radiant-tone-eye-cream-de-eucerin","radiant-tone-cleansing-gel-de-eucerin"];
          for (const id of newIds) {
            const p = data.products.find(x => x.id === id);
            if (!p) throw new Error(`Falta producto nuevo: ${id}`);
            if (p.image !== null) throw new Error(`image debe quedar null en ${id}`);
            if (typeof p.description !== 'string' || p.description.length < 80) throw new Error(`Descripción insuficiente en ${id}`);
            if (/\binventario\b|\bexistencia\b|\bstock\b/i.test(p.description)) throw new Error(`Descripción genérica en ${id}`);
          }
          const newSkus = ["FARA00003105","FARA00032005","FARA00032006","FARA00032007","FARA00070002","FARA00070003","FARA00070004","FARA00074005","FARA00074006","FARA00088217","FARA00088420","FARA00088521","FARA00088635","FARA00088640","FARA00088680","FARA00089000","FARA00089001","FARA00089002","FARA00089003","FARA00089004","FARA00089005","FARA00089006","FARA00090000","FARA00090001","FARA00090002","FARA00090003"];
          for (const sku of newSkus) {
            if (!checked.allBySku.has(sku)) throw new Error(`Falta SKU nuevo: ${sku}`);
          }
          console.log(JSON.stringify({stats:checked.stats,newProducts:newIds.length,newSkus:newSkus.length},null,2));
          NODE

      - name: Commit catalog update and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-inventory-20261005.yml
          git add assets/inventory.json
          git commit -m "Update FARA inventory from 2026-10-05 spreadsheet"
          git push origin HEAD:main
