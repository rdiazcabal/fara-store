name: One-time product descriptions
on:
  push:
    branches:
      - feature/product-descriptions
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add descriptions and wire product detail
        run: |
          node scripts/one-time-add-product-descriptions.js
          node --check assets/inventory-core.js
          node --check assets/inventory-document.js
          node --check assets/inventory-store.js
          node --test tests/*.test.js
          node scripts/inventory.js validate
      - name: Commit storefront changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/inventory.json assets/inventory-core.js assets/inventory-document.js assets/inventory-store.js assets/inventory-loader.js assets/app.js assets/products-page.js index.html productos.html tests/catalog-display.test.js tests/category-filter.test.js
          git diff --cached --quiet && exit 0
          git commit -m 'feat: add descriptions to every product detail'
          git push origin HEAD:feature/product-descriptions
