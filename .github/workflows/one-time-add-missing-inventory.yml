name: One-time add missing FARA inventory
on:
  push:
    branches:
      - inventory/add-missing-sep09
    paths:
      - scripts/import-missing-inventory-20260909.js
      - .github/workflows/one-time-add-missing-inventory.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add only missing references to canonical JSON
        run: |
          node scripts/import-missing-inventory-20260909.js | tee /tmp/import-report.json
          node scripts/inventory.js validate
      - name: Commit only canonical inventory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/inventory.json
          git diff --cached --quiet && exit 0
          git commit -m 'inventory: add references missing from latest FARA file'
          git push origin HEAD:inventory/add-missing-sep09
