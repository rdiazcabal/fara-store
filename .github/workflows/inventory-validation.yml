name: Validate FARA Inventory

on:
  pull_request:
    paths:
      - 'assets/inventory-*.js'
      - 'assets/inventory-catalog.json'
      - 'assets/inventory-additions-20260909.json'
      - 'assets/app.js'
      - 'assets/products-page.js'
      - 'data/inventory-*.json'
      - 'scripts/*.js'
      - 'Dockerfile'
      - 'index.html'
      - 'productos.html'
      - 'tests/*.test.js'
      - '.github/workflows/inventory-validation.yml'
  push:
    branches: [main]
    paths:
      - 'assets/inventory-*.js'
      - 'assets/inventory-catalog.json'
      - 'assets/inventory-additions-20260909.json'
      - 'assets/app.js'
      - 'assets/products-page.js'
      - 'data/inventory-*.json'
      - 'scripts/*.js'
      - 'Dockerfile'
      - 'index.html'
      - 'productos.html'
      - 'tests/*.test.js'
      - '.github/workflows/inventory-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate catalog, SKUs, prices and cart
        run: |
          node --check assets/inventory-store.js
          node --check scripts/build-inventory.js
          node --check scripts/reconcile-inventory.js
          node --test tests/*.test.js
          mkdir -p /tmp/fara-inventory-preview
          node scripts/reconcile-inventory.js /tmp/fara-inventory-preview/inventory-catalog.json /tmp/fara-inventory-preview
      - name: Save reconciliation preview
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fara-inventory-preview
          path: /tmp/fara-inventory-preview/
          retention-days: 3
