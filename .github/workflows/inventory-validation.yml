name: Validate FARA Inventory

on:
  pull_request:
    paths:
      - 'assets/inventory-*.js'
      - 'assets/inventory-*.json'
      - 'assets/app.js'
      - 'assets/products-page.js'
      - 'index.html'
      - 'productos.html'
      - 'scripts/build-inventory.js'
      - 'data/inventory-review-*.json'
      - 'Dockerfile'
      - 'tests/*.test.js'
      - '.github/workflows/inventory-validation.yml'
  push:
    branches: [main]
    paths:
      - 'assets/inventory-*.js'
      - 'assets/inventory-*.json'
      - 'assets/app.js'
      - 'assets/products-page.js'
      - 'index.html'
      - 'productos.html'
      - 'scripts/build-inventory.js'
      - 'data/inventory-review-*.json'
      - 'Dockerfile'
      - 'tests/*.test.js'
      - '.github/workflows/inventory-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate catalog, SKUs, prices and cart
        run: |
          node --check assets/inventory-store.js
          node --check scripts/build-inventory.js
          node --test tests/*.test.js
          node scripts/build-inventory.js /tmp/fara-inventory-catalog.json
