name: Deploy FARA Store to ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: fara-store-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "269531437168"
  AWS_ROLE_ARN: arn:aws:iam::269531437168:role/GitHubActionsFacturacionRole

  ECR_REPOSITORY: farahn-store-web

  ECS_CLUSTER: facturacion-cluster
  ECS_SERVICE: farahn-store-web
  ECS_CONTAINER_NAME: farahn-store-web
  ECS_TASK_DEFINITION_FILE: deploy/ecs-task-definition.json
  ECS_EXECUTION_ROLE_ARN: arn:aws:iam::269531437168:role/facturacionTaskExecutionRole
  SOURCE_ECS_SERVICE: facturacion-service

  LOG_GROUP: /ecs/farahn-store-web

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: GitHubActionsFacturacionDeploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate AWS account and ECS cluster
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          if [[ "$CURRENT_ACCOUNT_ID" != "$AWS_ACCOUNT_ID" ]]; then
            echo "::error::OIDC assumed AWS account $CURRENT_ACCOUNT_ID, but $AWS_ACCOUNT_ID was expected."
            exit 1
          fi

          CLUSTER_STATUS=$(aws ecs describe-clusters \
            --clusters "$ECS_CLUSTER" \
            --query 'clusters[0].status' \
            --output text)

          if [[ "$CLUSTER_STATUS" != "ACTIVE" ]]; then
            echo "::error::ECS cluster $ECS_CLUSTER does not exist or is not ACTIVE."
            exit 1
          fi

      - name: Prepare ECR repository and log group
        shell: bash
        run: |
          set -euo pipefail

          if ! aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1; then
            aws ecr create-repository \
              --repository-name "$ECR_REPOSITORY" \
              --image-scanning-configuration scanOnPush=true \
              --image-tag-mutability MUTABLE >/dev/null
          fi

          LOG_GROUP_EXISTS=$(aws logs describe-log-groups \
            --log-group-name-prefix "$LOG_GROUP" \
            --query "logGroups[?logGroupName=='$LOG_GROUP'].logGroupName | [0]" \
            --output text)

          if [[ "$LOG_GROUP_EXISTS" != "$LOG_GROUP" ]]; then
            aws logs create-log-group --log-group-name "$LOG_GROUP"
          fi

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build-image
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          LATEST_IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          docker build \
            --tag "$IMAGE_URI" \
            --tag "$LATEST_IMAGE_URI" \
            .

          docker push "$IMAGE_URI"
          docker push "$LATEST_IMAGE_URI"

          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Render ECS task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION_FILE }}
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Register ECS task definition
        id: register-task-definition
        shell: bash
        env:
          RENDERED_TASK_DEFINITION: ${{ steps.render-task-definition.outputs.task-definition }}
        run: |
          set -euo pipefail

          TASK_DEFINITION_ARN=$(aws ecs register-task-definition \
            --cli-input-json "file://$RENDERED_TASK_DEFINITION" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "task-definition-arn=$TASK_DEFINITION_ARN" >> "$GITHUB_OUTPUT"

      - name: Create or update ECS service
        shell: bash
        env:
          TASK_DEFINITION_ARN: ${{ steps.register-task-definition.outputs.task-definition-arn }}
          ECS_SUBNETS: ${{ vars.ECS_SUBNETS }}
          ECS_SECURITY_GROUPS: ${{ vars.ECS_SECURITY_GROUPS }}
          ECS_TARGET_GROUP_ARN: ${{ vars.ECS_TARGET_GROUP_ARN }}
          ECS_ASSIGN_PUBLIC_IP: ${{ vars.ECS_ASSIGN_PUBLIC_IP }}
          ECS_DESIRED_COUNT: ${{ vars.ECS_DESIRED_COUNT }}
        run: |
          set -euo pipefail

          SOURCE_STATUS=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$SOURCE_ECS_SERVICE" \
            --query 'services[0].status' \
            --output text 2>/dev/null || true)

          if [[ "$SOURCE_STATUS" == "ACTIVE" || "$SOURCE_STATUS" == "DRAINING" ]]; then
            DISCOVERED_SUBNETS=$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$SOURCE_ECS_SERVICE" \
              --query 'services[0].networkConfiguration.awsvpcConfiguration.subnets' \
              --output text | tr '\t' ',')

            DISCOVERED_SECURITY_GROUPS=$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$SOURCE_ECS_SERVICE" \
              --query 'services[0].networkConfiguration.awsvpcConfiguration.securityGroups' \
              --output text | tr '\t' ',')

            DISCOVERED_ASSIGN_PUBLIC_IP=$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$SOURCE_ECS_SERVICE" \
              --query 'services[0].networkConfiguration.awsvpcConfiguration.assignPublicIp' \
              --output text)

            ECS_SUBNETS="${ECS_SUBNETS:-$DISCOVERED_SUBNETS}"
            ECS_SECURITY_GROUPS="${ECS_SECURITY_GROUPS:-$DISCOVERED_SECURITY_GROUPS}"
            ECS_ASSIGN_PUBLIC_IP="${ECS_ASSIGN_PUBLIC_IP:-$DISCOVERED_ASSIGN_PUBLIC_IP}"
          fi

          : "${ECS_SUBNETS:?Set ECS_SUBNETS or ensure $SOURCE_ECS_SERVICE has awsvpc subnets}"
          : "${ECS_SECURITY_GROUPS:?Set ECS_SECURITY_GROUPS or ensure $SOURCE_ECS_SERVICE has security groups}"

          ASSIGN_PUBLIC_IP="${ECS_ASSIGN_PUBLIC_IP:-DISABLED}"
          DESIRED_COUNT="${ECS_DESIRED_COUNT:-1}"
          NETWORK_CONFIGURATION="awsvpcConfiguration={subnets=[$ECS_SUBNETS],securityGroups=[$ECS_SECURITY_GROUPS],assignPublicIp=$ASSIGN_PUBLIC_IP}"

          echo "Using subnets: $ECS_SUBNETS"
          echo "Using security groups: $ECS_SECURITY_GROUPS"
          echo "Assign public IP: $ASSIGN_PUBLIC_IP"

          SERVICE_STATUS=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].status' \
            --output text 2>/dev/null || true)

          if [[ "$SERVICE_STATUS" == "ACTIVE" || "$SERVICE_STATUS" == "DRAINING" ]]; then
            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$ECS_SERVICE" \
              --task-definition "$TASK_DEFINITION_ARN" \
              --network-configuration "$NETWORK_CONFIGURATION" \
              --force-new-deployment >/dev/null
          else
            CREATE_SERVICE_ARGS=(
              aws ecs create-service
              --cluster "$ECS_CLUSTER"
              --service-name "$ECS_SERVICE"
              --task-definition "$TASK_DEFINITION_ARN"
              --desired-count "$DESIRED_COUNT"
              --launch-type FARGATE
              --platform-version LATEST
              --network-configuration "$NETWORK_CONFIGURATION"
              --deployment-configuration 'maximumPercent=200,minimumHealthyPercent=100,deploymentCircuitBreaker={enable=true,rollback=true}'
            )

            if [[ -n "${ECS_TARGET_GROUP_ARN:-}" ]]; then
              CREATE_SERVICE_ARGS+=(
                --load-balancers
                "targetGroupArn=$ECS_TARGET_GROUP_ARN,containerName=$ECS_CONTAINER_NAME,containerPort=80"
                --health-check-grace-period-seconds 60
              )
            else
              echo "::warning::ECS_TARGET_GROUP_ARN is not configured. The ECS service will be created without an ALB association."
            fi

            "${CREATE_SERVICE_ARGS[@]}" >/dev/null
          fi

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

      - name: Deployment summary
        shell: bash
        run: |
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].{service:serviceName,status:status,running:runningCount,desired:desiredCount,taskDefinition:taskDefinition,network:networkConfiguration.awsvpcConfiguration,loadBalancers:loadBalancers}'
