# Rate limits are evaluated by the real client IP restored from the ALB
# X-Forwarded-For header. Replace 10.0.0.0/8 with the exact ALB subnet
# CIDRs when they are available.
limit_req_zone $binary_remote_addr zone=fara_pages:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=fara_assets:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=fara_connections:10m;

log_format fara_security '$remote_addr forwarded="$http_x_forwarded_for" - '
                         '[$time_local] "$request" $status $body_bytes_sent '
                         'request_time=$request_time referer="$http_referer" '
                         'user_agent="$http_user_agent"';

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The ECS tasks receive traffic through an internal Application Load Balancer.
  # real_ip_recursive selects the last non-trusted address from X-Forwarded-For,
  # preventing a spoofed first value from becoming the logged/rate-limited IP.
  set_real_ip_from 10.0.0.0/8;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  access_log /var/log/nginx/access.log fara_security;
  error_log /var/log/nginx/error.log warn;

  server_tokens off;
  limit_req_status 429;
  limit_conn_status 429;
  limit_conn fara_connections 30;

  client_max_body_size 8k;
  client_header_timeout 10s;
  client_body_timeout 10s;
  send_timeout 15s;
  keepalive_timeout 20s;
  reset_timedout_connection on;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # FARA is a static storefront. Methods that can modify server-side content
  # are not required and are rejected before reaching the application.
  if ($request_method !~ ^(GET|HEAD)$) {
    return 405;
  }

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # Common reconnaissance paths have no purpose in this static application.
  location ~* ^/(?:\.env|\.git|\.svn|wp-admin|wp-login\.php|xmlrpc\.php|phpmyadmin|adminer|actuator|vendor/phpunit|cgi-bin)(?:/|$) {
    access_log off;
    return 404;
  }

  location = /index.html {
    limit_req zone=fara_pages burst=20 nodelay;
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    try_files $uri =404;
  }

  location / {
    limit_req zone=fara_pages burst=20 nodelay;
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:css|js)$ {
    limit_req zone=fara_assets burst=100 nodelay;
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate, max-age=0" always;
    try_files $uri =404;
  }

  location ~* \.(?:jpg|jpeg|gif|png|svg|ico|webp|woff2?)$ {
    limit_req zone=fara_assets burst=100 nodelay;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }
}
